plugins {
    id 'net.neoforged.moddev' version '2.0.141'
    id 'maven-publish'
    id("com.github.spotbugs") version "6.5.9"
    id "pmd"
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${project.mod_id}-neoforge"
}

repositories {
    mavenCentral()
}

def targetJavaVersion = 25
java.toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
        "${project.mod_id}_tests" {
            sourceSet sourceSets.test
        }
    }
}

// Put NeoForge/Minecraft on the test source set classpath (gametests live there).
neoForge.addModdingDependenciesTo(sourceSets.test)

dependencies {
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'
    testCompileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'
    testImplementation sourceSets.main.output
}

// Expand placeholders in the templated mod metadata (neoforge.mods.toml).
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.register('buildCopy', Copy) {
    dependsOn tasks.named('jar')
    from(tasks.named('jar').flatMap { it.archiveFile })
    into(layout.projectDirectory.dir("../builds"))
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

spotbugs {
    ignoreFailures = true
    excludeFilter = file("config/spotbugs/excludeFilter.xml")
}

tasks.named('spotbugsMain') {
    reports {
        xml.required = true
        html.required = true
    }
}

pmd {
    toolVersion = "7.26.0"
    ignoreFailures = true
    consoleOutput = true
    ruleSets = []
    ruleSetFiles = files("config/pmd/ruleset.xml")
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.named('check') {
    dependsOn(tasks.named('runGameTestServer'))
}

tasks.named('test') {
    enabled = false
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from(components.java)
        }
    }
    repositories {
    }
}
