plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
    id("com.github.spotbugs") version "6.5.9"
    id "pmd"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

tasks.register('buildCopy', Copy) {
    dependsOn tasks.named('remapJar')
    from(tasks.named('remapJar').flatMap { it.archiveFile })
    into(layout.projectDirectory.dir("../builds"))
}

dependencies {
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-1.21.11:2025.12.20@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Client game test API for screenshot-diff rendering regression tests.
    modImplementation fabricApi.module("fabric-client-gametest-api-v1", project.fabric_version)

    // Uncomment the following line to enable the deprecated Fabric API modules.
    // These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

    // modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

spotbugs {
    ignoreFailures = true
    excludeFilter = file("config/spotbugs/excludeFilter.xml")
}

tasks.named('spotbugsMain') {
    reports {
        xml.required = true
        html.required = true
    }
}

pmd {
    toolVersion = "7.11.0"
    ignoreFailures = true
    consoleOutput = true
    ruleSets = []
    ruleSetFiles = files("config/pmd/ruleset.xml")
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

SourceSet mainSourceSet = sourceSets.main
SourceSet testSourceSet = sourceSets.test
SoftwareComponent javaComponent = components.named("java").get()

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

loom {
    runs {
        gameTest {
            inherit server
            name "Game Test Server"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${file("build/test-results/gametest/TEST-gametest.xml")}"
            source(mainSourceSet)
            source(testSourceSet)
            ideConfigGenerated = true
            runDir "build/gametest"
        }
        clientGameTest {
            client()
            name "Client Game Test"
            vmArg "-Dfabric.client.gametest"
            vmArg "-Dfabric.client.gametest.testModResourcesPath=${file("src/test/resources").absolutePath.replace('\\', '/')}"
            source(mainSourceSet)
            source(testSourceSet)
            ideConfigGenerated = false
            runDir "build/clientgametest"
        }
    }
}

tasks.named('check') {
    dependsOn(tasks.named('runGameTest'))
}

tasks.named('test') {
    enabled = false
}

tasks.named('runGameTest').configure {
    doFirst {
        def gameTestDir = file("build/gametest")
        gameTestDir.mkdirs()
        def serverProperties = new File(gameTestDir, "server.properties")
        if (!serverProperties.exists()) {
            serverProperties.text = "online-mode=false\nmotd=GameTest\n"
        }
        def eulaFile = new File(gameTestDir, "eula.txt")
        if (!eulaFile.exists()) {
            eulaFile.text = "eula=true\n"
        }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from(javaComponent)
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
